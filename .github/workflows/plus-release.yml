name: Wholphin+ release

# Tag the branch with plus-<n> and this builds, signs and publishes a release
# the app's own updater can see. The release title must be a bare version
# string (v1.0.8-3-gabc1234) because UpdateChecker parses it with a strict regex.

on:
  push:
    tags:
      - plus-*
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Fetch upstream tags
        # The fork does not carry upstream's release tags, so `git describe` here
        # would name the build after whatever old tag it can reach. Pulling the
        # tags in (rather than pushing them to the fork) also avoids waking
        # upstream's own release workflow, which triggers on v* tags.
        run: |
          git remote add upstream https://github.com/damontecres/Wholphin.git || true
          git fetch --tags --quiet upstream
          git describe --tags --long --match='v*'
      - name: Pre-accept Android SDK licenses
        # cmdline-tools 20.0 walks the licences interactively, so `sdkmanager --licenses`
        # dies on an empty stdin. Writing the hashes it looks for leaves it nothing to ask.
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$sdk_root/licenses"
          cd "$sdk_root/licenses"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee > android-sdk-license
          printf '%s\n' 84831b9409646a918e30573bab4c9c91346d8abd > android-sdk-preview-license
          printf '%s\n' 601085b94cd77f0b54ff86406957099ebe79c4d6 > android-googletv-license
          printf '%s\n' 859f317696f67ef3d7f30a50a5560e7834b43903 > android-sdk-arm-dbt-license
          printf '%s\n' 33b6a2b64607f11b759f320ef9dff4ae5c47d97a > google-gdk-license
          printf '%s\n' e9acab5b5fbb560a72cfaecce8946896ff6aab9d > mips-android-sysimage-license
          printf '%s\n' d975f751698a77b662f1254ddbeed3901e976f5a > intel-android-extra-license
      # Deliberately not ./.github/actions/setup: that one asks for the retired
      # `tools` package, which sdkmanager can no longer find.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools build-tools;${{ env.BUILD_TOOLS_VERSION }} ndk;${{ env.NDK_VERSION }}"
      - name: Add NDK to path
        run: |
          ndk_root="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          echo "$ndk_root:$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - name: Build app
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ secrets.EXTENSIONS_USERNAME }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.EXTENSIONS_PASSWORD }}"
        run: ./gradlew assembleDefaultRelease --no-daemon
      - name: Verify signatures
        run: |
          find app/build/outputs -name '*.apk' -print0 |
            xargs -0 -n1 "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" \
              verify --verbose --print-certs | grep -E "Signer #1 certificate SHA-256|Verifies"
      - name: Name the assets the way the updater expects
        # UpdateChecker looks for Wholphin-release-<abi>.apk, then
        # Wholphin-release.apk, then Wholphin.apk — in that order.
        run: |
          mkdir -p release-assets
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            case "$f" in
              *-arm64-v8a.apk) cp "$f" release-assets/Wholphin-release-arm64-v8a.apk ;;
              *-armeabi-v7a.apk) cp "$f" release-assets/Wholphin-release-armeabi-v7a.apk ;;
              *-x86_64.apk) cp "$f" release-assets/Wholphin-release-x86_64.apk ;;
              *) cp "$f" release-assets/Wholphin-release.apk ;;
            esac
          done
          ls -l release-assets
          sha256sum release-assets/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(git describe --tags --long --match='v*')"
          echo "Release title: $version"
          gh release create "${{ github.ref_name }}" \
            --latest --title "$version" --verify-tag \
            --notes "Wholphin+ built from ${{ github.sha }}. Signal theme, card progress bar, alphabet bar." \
            release-assets/*
